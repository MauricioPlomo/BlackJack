<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game">
        <div id="betting">
            <p>Dinero: <span id="player-money">500</span> €</p>
            <p>Apuesta: <span id="current-bet">0</span> €</p>
            <div id="bet-buttons">
                <button class="bet" data-amount="1">+1</button>
                <button class="bet" data-amount="5">+5</button>
                <button class="bet" data-amount="10">+10</button>
                <button class="bet" data-amount="25">+25</button>
                <button class="bet" data-amount="50">+50</button>
                <button class="bet" data-amount="100">+100</button>
                <button id="bet-all">TODO</button>
            </div>
        </div>
    
        <!-- Mensaje de advertencia -->
        <div id="warning-message" aria-hidden="true">
            <p>¡Debes realizar una apuesta mínima para comenzar el juego!</p>
        </div>
    
        <div id="player-hand" class="hand player-hand">
            <h2>Jugador</h2>
            <div class="cards-container"></div>
        </div>
        <div id="dealer-hand" class="hand dealer-hand">
            <h2>Dealer</h2>
            <div class="cards-container"></div>
        </div>
        <div id="buttons">
            <button id="hit" disabled>Pedir carta</button>
            <button id="stand" disabled>Plantarse</button>
            <button id="restart" disabled>Reiniciar juego</button>
        </div>
        <div id="scores">
            <p>Tu puntaje: <span id="player-score">0</span></p>
            <p>Puntaje de la casa: <span id="dealer-score">0</span></p>
        </div>
        <div id="result" aria-live="polite"></div>
    </div>    
    <script src="game.js"></script>
</body>
</html>
